<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Varování: možný podvodný web</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#300a0a;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background-image:radial-gradient(circle at 50% 10%,#7d1f1f 0,#300a0a 52%)}main{width:min(680px,100%);background:rgba(20,5,5,.72);border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.38)}.icon{width:58px;height:58px;border-radius:18px;background:#fff;color:#9b1c1c;display:grid;place-items:center;font-size:30px;font-weight:900}h1{font-size:25px;margin:16px 0 8px}p{line-height:1.55;color:#f3dddd}code{display:inline-block;background:rgba(0,0,0,.32);padding:.2rem .45rem;border-radius:6px;word-break:break-all;color:#fff}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}button{font:inherit;padding:.75rem 1rem;border-radius:10px;border:1px solid rgba(255,255,255,.35);cursor:pointer;background:transparent;color:#fff}#safe{background:#fff;color:#7a1010;border-color:#fff;font-weight:750}#close{background:rgba(255,255,255,.1)}#go,#trust{font-size:.92rem}.minor{font-size:12px;color:#cfaeae;margin-top:18px}
</style></head><body><main><div class="icon">!</div><h1>Možný podvodný web</h1><p id="reason"></p><p>Otevíraná adresa: <code id="url"></code></p><p id="brandLine" hidden>Chráněný cíl: <code id="brand"></code></p><div class="buttons"><button id="safe" hidden>Přejít na oficiální web</button><button id="close">Zavřít stránku</button><button id="go">Pokračovat na vlastní riziko</button><button id="trust" hidden>Vytvořit důvěryhodnou výjimku</button></div><div class="minor">Výjimka vypne heuristická varování pro tuto doménu. Používejte ji jen tehdy, když jste adresu nezávisle ověřili.</div></main><script type="module" src="warning.js"></script></body></html>
